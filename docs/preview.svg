<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="dockbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dockbg)" rx="16"/>
  <!-- Header -->
  <rect x="30" y="25" width="1140" height="64" rx="10" fill="#0f172a" stroke="#0ea5e9"/>
  <text x="55" y="63" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">🐳 Docker Inventory &amp; FIFO Microservice — Multi-Stage · CI/CD · REST API</text>
  <rect x="910" y="40" width="235" height="34" rx="17" fill="#064e3b" stroke="#22c55e"/>
  <text x="932" y="62" fill="#86efac" font-family="monospace" font-size="13" font-weight="bold">● CONTAINER: HEALTHY (8080)</text>

  <!-- KPI Row -->
  <rect x="30" y="110" width="270" height="95" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="50" y="140" fill="#94a3b8" font-family="sans-serif" font-size="12">IMAGEN DOCKER MULTI-STAGE</text>
  <text x="50" y="178" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="bold">node:20-alpine</text>

  <rect x="320" y="110" width="270" height="95" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="340" y="140" fill="#94a3b8" font-family="sans-serif" font-size="12">UNIDADES EN BODEGA (LOTES)</text>
  <text x="340" y="178" fill="#f8fafc" font-family="monospace" font-size="28" font-weight="bold">143 Unidades</text>

  <rect x="610" y="110" width="270" height="95" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="630" y="140" fill="#94a3b8" font-family="sans-serif" font-size="12">VALORIZACIÓN COSTO (CLP)</text>
  <text x="630" y="178" fill="#4ade80" font-family="monospace" font-size="28" font-weight="bold">$202.050</text>

  <rect x="900" y="110" width="270" height="95" rx="10" fill="#1e293b" stroke="#ef4444"/>
  <text x="920" y="140" fill="#fca5a5" font-family="sans-serif" font-size="12">ALERTAS QUIEBRE DE STOCK</text>
  <text x="920" y="178" fill="#f87171" font-family="monospace" font-size="28" font-weight="bold">2 SKUs Críticos</text>

  <!-- Left Panel: FIFO Batches -->
  <rect x="30" y="225" width="680" height="375" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="55" y="262" fill="#f8fafc" font-family="sans-serif" font-size="17" font-weight="bold">Rotación de Inventario por Lotes (Algoritmo FIFO: First-In, First-Out)</text>
  <line x1="50" y1="280" x2="690" y2="280" stroke="#334155"/>
  <text x="55" y="312" fill="#94a3b8" font-family="monospace" font-size="13">SKU            LOTES ACTIVOS (ORDEN DE INGRESO)             TOTAL   ESTADO</text>
  <text x="55" y="352" fill="#e2e8f0" font-family="monospace" font-size="13">SKU-LAC-001    [LOTE-01: 25u (01/Oct)] → [LOTE-02: 50u]     75 u    ÓPTIMO</text>
  <text x="55" y="392" fill="#fca5a5" font-family="monospace" font-size="13">SKU-ABA-002    [LOTE-03: 18u (15/Sep)] (Mínimo: 30u)        18 u    CRÍTICO</text>
  <text x="55" y="432" fill="#e2e8f0" font-family="monospace" font-size="13">SKU-FAR-003    [LOTE-04: 12u (01/Sep)] → [LOTE-05: 30u]     42 u    ÓPTIMO</text>
  <text x="55" y="472" fill="#fca5a5" font-family="monospace" font-size="13">SKU-LOG-004    [LOTE-06: 8u  (20/Sep)] (Mínimo: 15u)        8 u     CRÍTICO</text>

  <rect x="55" y="510" width="630" height="65" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="75" y="538" fill="#38bdf8" font-family="monospace" font-size="13">POST /api/inventory/consume-fifo {"sku": "SKU-LAC-001", "quantity": 30}</text>
  <text x="75" y="560" fill="#86efac" font-family="monospace" font-size="12">→ Agota 25u de LOTE-2026-01 y descuenta 5u de LOTE-2026-02 automáticamente.</text>

  <!-- Right Panel: Dockerfile Multi-Stage -->
  <rect x="730" y="225" width="440" height="375" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="755" y="262" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">Pipeline Dockerfile Multi-Stage &amp; CI/CD</text>
  <line x1="750" y1="280" x2="1150" y2="280" stroke="#334155"/>
  <text x="755" y="318" fill="#fbbf24" font-family="monospace" font-size="13"># Etapa 1: Quality Gate &amp; Unit Tests</text>
  <text x="755" y="343" fill="#e2e8f0" font-family="monospace" font-size="13">FROM node:20-alpine AS tester</text>
  <text x="755" y="368" fill="#4ade80" font-family="monospace" font-size="13">RUN npm test  # 3/3 FIFO Tests PASS</text>
  <text x="755" y="410" fill="#fbbf24" font-family="monospace" font-size="13"># Etapa 2: Imagen Segura de Producción</text>
  <text x="755" y="435" fill="#e2e8f0" font-family="monospace" font-size="13">FROM node:20-alpine AS production</text>
  <text x="755" y="460" fill="#7dd3fc" font-family="monospace" font-size="13">USER node     # Ejecución sin root</text>
  <text x="755" y="485" fill="#e2e8f0" font-family="monospace" font-size="13">HEALTHCHECK --interval=30s \</text>
  <text x="755" y="510" fill="#e2e8f0" font-family="monospace" font-size="13">  CMD wget -q --spider /api/health</text>
  <text x="755" y="560" fill="#22c55e" font-family="monospace" font-size="12">✓ GitHub Actions CI/CD Workflow Activo</text>
</svg>
