version: "3.9"

services:
  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: inventory-fifo-service
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  backend-net:
    driver: bridge
